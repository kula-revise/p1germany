:root{--navy:#131C31;--navy-2:#1A2440;--navy-3:#27324D;--pink:#FF4D94;--pink-deep:#D81B6A;--pink-hover:#B81459;--cream:#F2EFE8;--paper:#FAF7EF;--white:#FFFFFF;--blue:#33587A;--blue-deep:#2E5675;--blue-tint:#E8EEF4;--green:#3BA060;--green-text:#237645;--green-tint:#E6F3EA;--amber:#E0A52A;--amber-text:#8A5E08;--amber-tint:#FBF1DA;--hi:#EED296;--line:#DDD8CC;--muted:#566074}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--cream);color:var(--navy);font-size:16px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0}
button{font-family:inherit;font-size:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:0 28px}
header.top{background:var(--navy);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:14px 14px;color:var(--white);padding:22px 0 20px}
header.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.brand{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#B9C3D6;margin-bottom:6px}
.ttl{font-size:38px;line-height:1.05}
.ttl .acc{color:var(--pink);display:block}
.pill{background:var(--navy-3);border:1px solid #3B4766;color:var(--white);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.pill:hover{background:#34405f}
.homebtn{background:transparent;border:1px solid #56627f;color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;margin-right:8px}
.homebtn:hover{background:#27324D}
main{padding:28px 0 40px}
.layout{display:grid;grid-template-columns:210px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.rail button{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--navy);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.rail button:hover{border-color:var(--blue)}
.rail button.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.rail .num{width:24px;height:24px;border-radius:50%;background:var(--blue-tint);color:var(--blue-deep);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.rail button.on .num{background:var(--pink);color:#fff}
.rail button.done .num{background:var(--green);color:#fff}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pink-deep);margin-bottom:4px}
h2{font-size:30px;line-height:1.1;margin-bottom:12px}
h3{font-size:20px;margin-bottom:8px}
p{margin:0 0 12px}
.lede{font-size:17px;color:#2b3550}
.muted{color:var(--muted)}
.btn{background:var(--pink-deep);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--pink-hover)}
.btn:disabled{background:#c9c3b8;color:#fff;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--navy);border:2px solid var(--navy)}
.btn.ghost:hover{background:var(--blue-tint)}
.btn.small{padding:8px 14px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--blue-deep);text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
.hero{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:30px 32px;margin-bottom:20px}
.hero .big{font-size:46px;line-height:1.02;margin-bottom:14px}
.hero .big span{color:var(--pink-deep);display:block}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.qlist{margin:0;padding-left:22px}
.qlist li{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.how{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.how b{display:block;margin-bottom:4px}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.nextrow .right{display:flex;align-items:center;gap:12px;margin-left:auto}
.gatehint{background:var(--amber-tint);color:var(--amber-text);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
.note{background:var(--blue-tint);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin:12px 0}
.note.ok{background:var(--green-tint);border-color:var(--green)}
.note.fix{background:var(--amber-tint);border-color:var(--amber)}
.split{display:grid;grid-template-columns:.95fr 1.05fr;gap:22px;align-items:start}
.booklet{position:sticky;top:16px;background:var(--white);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.booklet .bh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.booklet .bh .lbl{font-weight:700;margin-right:6px}
.tab{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--navy)}
.tab.use{border:2px solid var(--blue)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.booklet .bb{padding:16px 20px;overflow:auto}
.who{font-style:italic;border-left:3px solid var(--blue);padding-left:12px;color:#33405e;margin-bottom:14px;font-size:15px}
.srctext p{font-family:Georgia,'Times New Roman',serif;font-size:16.5px;line-height:1.6}
.gloss{font-size:13px;color:var(--muted);margin-top:8px}
.qstrip{background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.qstrip .ql{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B9C3D6;font-weight:700}
.qstrip .qt{font-size:17px;font-weight:600}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--navy)}
.subtabs button.on{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}

    var mini = filled.length ? '<table class="minitbl"><tr><th></th><th>Supports</th><th>Counters</th></tr>' + filled.map(function (l) { return '<tr><td><b>' + (l === "OK" ? "Own knowledge" : l) + '</b></td><td>' + esc(t[l].s).replace(/\n/g, "<br>") + '</td><td>' + esc(t[l].c).replace(/\n/g, "<br>") + '</td></tr>'; }).join("") + '</table>' : '<p class="muted">Your table is empty.</p>';
    var p = e.perspectives.filter(function (x) { return x.id === d.persp; })[0];
    var agT = { agree: "You agree.", partly: "You partly agree.", disagree: "You disagree." }[d.pagree] || "";
    return '<div class="wa"><div class="aside">' + (d.thesis ? '<div class="thesisbox"><b>Your thesis:</b> ' + esc(d.thesis) + '</div>' : "") +
      '<details><summary><b>Your table</b></summary>' + mini + '</details>' +
      (p ? '<details style="margin-top:8px"><summary><b>Your perspective</b></summary><p style="font-size:14.5px">' + esc(p.d) + ' ' + agT + '</p></details>' : "") +
      '<details style="margin-top:8px"><summary><b>A shape you can use</b></summary><ul>' + e.shape.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul></details></div>' +
      '<p class="muted">Leave a blank line between paragraphs.</p>' +
      '<div><textarea rows="14" data-ans="' + q.id + '" placeholder="Start with your thesis.">' + esc(d["a_" + q.id]) + '</textarea><div class="wc"><span data-wc="' + q.id + '">' + words(d["a_" + q.id]) + '</span> words</div></div>' +
      '<div><button class="btn small" data-act="checkans" data-q="' + q.id + '">Check my answer</button></div>' +
      '<div id="fb_' + q.id + '">' + (d["chk_" + q.id] ? feedback(q) : "") + '</div></div>' +
      nextrow({ back: "prevsub", next: "nextstep", label: "Go to your answers" });
  }

  /* ---------- answers ---------- */
  function answersText() {
    var d = D(), out = [P.title + " " + P.titleAccent, ""];
    P.questions.forEach(function (q) {
      out.push("Question " + q.n + " [" + q.marks + " marks]"); out.push(q.text); out.push("");
      out.push(d["a_" + q.id].trim() || "(no answer)"); out.push("");
    });
    var t = d.tbl, rows = LETTERS.concat(["OK"]).filter(function (l) { return (t[l].s + t[l].c).trim(); });
    if (rows.length) {
      out.push("Question " + ESSAY.n + " table");
      rows.forEach(function (l) { out.push((l === "OK" ? "Own knowledge" : "Source " + l) + ": supports: " + t[l].s.replace(/\n/g, "; ") + " | counters: " + t[l].c.replace(/\n/g, "; ")); });
    }
    return out.join("\n");
  }
  function answersScreen() {
    var d = D();
    var cards = P.questions.map(function (q, i) {
      var a = d["a_" + q.id];
      return '<div class="card"><div class="eyebrow">Question ' + esc(q.n) + ' [' + q.marks + ' marks] · ' + words(a) + ' words</div><p><b>' + esc(q.text) + '</b></p>' +
        (a.trim() ? '<div class="paperbox">' + esc(a) + '</div>' : '<p class="muted">You have not answered this question yet.</p>') +
        '<button class="btn ghost small" data-act="editans" data-i="' + (STEPS.map(function (x) { return x.id; }).indexOf(q.id)) + '">Edit this answer</button></div>';
    }).join("");
    return '<div class="card" style="border:0;background:transparent;padding:0"><div class="eyebrow">Finished?</div><h2>Your answers</h2></div>' + cards +
      nextrow({ back: "prevstep", next: "home", label: "Back to the start" });
  }

  /* ---------- render ---------- */
  function render() {
    var body;
    if (!S.started || S.onStart) body = startScreen();
    else {
      var id = STEPS[S.step].id, scr;
      if (id === "recall") { scr = recallScreen(); }
      else if (id === "revise") { scr = reviseScreen(); }
      else if (id === "paper") { if (!S.seenPaper) { S.seenPaper = true; save(); } scr = paperScreen(); }
      else if (id === "answers") scr = answersScreen();
      else scr = questionScreen(P.questions.filter(function (q) { return q.id === id; })[0]);
      body = '<div class="layout">' + rail() + '<div>' + scr + '</div></div>';
    }
    app.innerHTML = header() + '<main><div class="wrap">' + body + '</div></main>' + footer();
  }
  function go(i) { S.step = Math.max(0, Math.min(STEPS.length - 1, i)); S.onStart = false; save(); render(); window.scrollTo(0, 0); }
  function curQ() { var id = STEPS[S.step].id; return P.questions.filter(function (q) { return q.id === id; })[0]; }
  function nsubs(q) { return q.role === "essay" ? 4 : 3; }

  /* ---------- events ---------- */
  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.getAttribute("data-act"), d = D(), q;
    switch (a) {
      case "begin": S.started = true; S.onStart = false; save(); render(); window.scrollTo(0, 0); break;
      case "home": S.onStart = true; save(); render(); window.scrollTo(0, 0); break;
      case "goanswers": go(STEPS.length - 1); break;
      case "step": go(+b.getAttribute("data-i")); break;
      case "nextstep": go(S.step + 1); break;
      case "prevstep": go(S.step - 1); break;
      case "editans": go(+b.getAttribute("data-i")); q = curQ(); S.sub[q.id] = q.role === "essay" ? 3 : 1; save(); render(); break;
      case "sub": S.sub[b.getAttribute("data-q")] = +b.getAttribute("data-i"); save(); render(); break;
      case "nextsub": q = curQ(); S.sub[q.id] = Math.min(nsubs(q) - 1, (S.sub[q.id] || 0) + 1); save(); render(); window.scrollTo(0, 0); break;
      case "prevsub": q = curQ(); S.sub[q.id] = Math.max(0, (S.sub[q.id] || 0) - 1); save(); render(); window.scrollTo(0, 0); break;
      case "tab": S.tabs[b.getAttribute("data-k")] = b.getAttribute("data-l"); save(); render(); break;
      case "recallcheck": d.recallChk[d.recallIdx || 0] = true; save(); render(); break;
      case "recallagain": d.recallChk[d.recallIdx || 0] = false; save(); render(); break;
      case "recallgo": d.recallIdx = +b.getAttribute("data-k"); save(); render(); break;
      case "recallback": d.recallIdx = Math.max(0, (d.recallIdx || 0) - 1); save(); render(); window.scrollTo(0, 0); break;
      case "recallskip": case "recallnext":
        if ((d.recallIdx || 0) < P.revise.cards.length - 1) { d.recallIdx = (d.recallIdx || 0) + 1; save(); render(); window.scrollTo(0, 0); } else go(S.step + 1);
        break;
      case "psub": S.sub.paper = +b.getAttribute("data-i"); save(); render(); break;
      case "pnext": S.sub.paper = Math.min(2, (S.sub.paper || 0) + 1); save(); render(); window.scrollTo(0, 0); break;
      case "pback": S.sub.paper = Math.max(0, (S.sub.paper || 0) - 1); save(); render(); window.scrollTo(0, 0); break;
      case "revstart": S.rev.pack = b.getAttribute("data-p"); S.rev.idx = 0; save(); render(); window.scrollTo(0, 0); break;
      case "revgo": S.rev.idx = +b.getAttribute("data-k"); save(); render(); break;
      case "reveal": var rk = S.rev.pack + S.rev.idx; S.rev.reveal[rk] = S.rev.reveal[rk] || {}; var j = b.getAttribute("data-j"); S.rev.reveal[rk][j] = !S.rev.reveal[rk][j]; save(); render(); break;
      case "revall":
        var pk = revPack(S.rev.pack), c = pk.cards[S.rev.idx], n = (c.tbl || c.cues).length, rk2 = S.rev.pack + S.rev.idx, cur = S.rev.reveal[rk2] || {};
        var allOpen = true; for (var x = 0; x < n; x++) if (!cur[x]) allOpen = false;
        S.rev.reveal[rk2] = {}; if (!allOpen) for (var y = 0; y < n; y++) S.rev.reveal[rk2][y] = true;
        save(); render(); break;
      case "revnext":
        if (S.rev.idx < revPack(S.rev.pack).cards.length - 1) S.rev.idx++; else { S.revDone[S.rev.pack] = true; S.rev.pack = null; }
        save(); render(); window.scrollTo(0, 0); break;
      case "revback": if (S.rev.idx > 0) S.rev.idx--; else S.rev.pack = null; save(); render(); break;
      case "sort": d["s_" + b.getAttribute("data-q")][b.getAttribute("data-id")] = b.getAttribute("data-v"); save(); render(); break;
      case "checksort": case "unsort":
        var sq = b.getAttribute("data-q"), sIt = sq === Q.opvl.id ? P.opvl.items : P.compare.items, pgN = Math.min(S.sub[sq + "_pg"] || 0, pages(sIt).length - 1);
        d["pc_" + sq] = d["pc_" + sq] || {}; d["pc_" + sq][pgN] = a === "checksort";
        d["sc_" + sq] = pages(sIt).every(function (x, k) { return d["pc_" + sq][k]; });
        save(); render(); break;
      case "sortpg": S.sub[b.getAttribute("data-q") + "_pg"] = +b.getAttribute("data-k"); save(); render(); break;
      case "sortnext": q = curQ(); S.sub[q.id + "_pg"] = (S.sub[q.id + "_pg"] || 0) + 1; save(); render(); window.scrollTo(0, 0); break;
      case "sortprev": q = curQ(); S.sub[q.id + "_pg"] = Math.max(0, (S.sub[q.id + "_pg"] || 0) - 1); save(); render(); window.scrollTo(0, 0); break;
      case "checkans": q = P.questions.filter(function (x) { return x.id === b.getAttribute("data-q"); })[0]; d["chk_" + q.id] = true; save();
        document.getElementById("fb_" + q.id).innerHTML = feedback(q); refreshRail(); break;
      case "stance": var l = b.getAttribute("data-l"); d.stanceOpen[l] = !d.stanceOpen[l]; save(); render(); break;
      case "addok":
        var k = P.essay.ownKnowledge.filter(function (z) { return z.id === b.getAttribute("data-id"); })[0], col = b.getAttribute("data-col"), cell = d.tbl.OK[col];
        if (cell.split("\n").indexOf(k.t) === -1) { d.tbl.OK[col] = cell.trim() ? cell.replace(/\s+$/, "") + "\n" + k.t : k.t; save(); render(); }
        break;
      case "persp": d.persp = b.getAttribute("data-id"); save(); render(); break;
      case "pagree": d.pagree = b.getAttribute("data-v"); save(); render(); break;
      case "pos": d.pos = b.getAttribute("data-id"); d.thesis = P.essay.positions.filter(function (p) { return p.id === d.pos; })[0].line; save(); render(); break;
      case "copy": copyText(answersText()); break;
      case "savefile":
        try { var blob = new Blob([answersText()], { type: "text/plain" }), u = URL.createObjectURL(blob), el = document.createElement("a"); el.href = u; el.download = "paper1_" + P.id + ".txt"; document.body.appendChild(el); el.click(); el.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); } catch (e) {}
        break;
    }
  });
  function copyText(t) {
    function done() { var c = document.getElementById("copied"); if (c) c.textContent = "Copied."; }
    function fallback() { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  }
  function refreshRail() { var r = document.querySelector(".rail"); if (r) r.outerHTML = rail(); }
  app.addEventListener("input", function (ev) {
    var t = ev.target, d = D();
    if (t.hasAttribute("data-ans")) {
      var id = t.getAttribute("data-ans"); d["a_" + id] = t.value;
      if (d["chk_" + id]) { d["chk_" + id] = false; var fb = document.getElementById("fb_" + id); if (fb) fb.innerHTML = ""; refreshRail(); }
      var wc = document.querySelector('[data-wc="' + id + '"]'); if (wc) wc.textContent = words(t.value);
      var pw = document.getElementById("pillwc"); if (pw) pw.textContent = totalWords();
      save();
    } else if (t.hasAttribute("data-tbl")) {
      d.tbl[t.getAttribute("data-tbl")][t.getAttribute("data-col")] = t.value; save();
      var nb = document.querySelector('.nextrow .btn[data-act="nextsub"]'), esub = S.sub[ESSAY.id] || 0;
      if (nb && STEPS[S.step].id === ESSAY.id && esub < 2) {
        var g = esub === 0 ? srcGate() : okGate(), msg = esub === 0 ? "Fill at least two source rows." : "Add something to the own knowledge row.";
        nb.disabled = !g; var h = document.querySelector(".nextrow .gatehint");
        if (g && h) h.remove(); else if (!g && !h) nb.insertAdjacentHTML("beforebegin", '<span class="gatehint">' + msg + '</span>');
      }
    } else if (t.hasAttribute("data-thesis")) { d.thesis = t.value; save(); }
    else if (t.hasAttribute("data-recall")) {
      d.recall[t.getAttribute("data-recall")] = t.value; save();
      var rb = document.querySelector('[data-act="recallcheck"]');
      if (rb) rb.disabled = !t.value.trim();
    }
  });
  render();
})();
</script></body></html>
